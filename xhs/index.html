<!DOCTYPE html>
<!--学号：24001010529 姓名：林洁 仿小红书首页 index.html-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页｜仿小红书</title>
    <link rel="stylesheet" href="lj_common.css">
    <link rel="stylesheet" href="lj_index.css">
</head>
<body>
    <!--顶部导航搜索区域-->
   <header class="lj_header">
    <div class="lj_header_left">
        <span class="lj_header_menu">☰</span>
    </div>

    <div class="lj_header_tab">
        <span>关注</span>
        <span class="active">发现</span>
        <span>大连</span>
    </div>

    <div class="lj_header_right">
        <span class="lj_header_search_icon">🔍</span>
    </div>
</header>

<div class="lj_category_tab">
    <span class="active">推荐</span>
    <span>视频</span>
    <span>直播</span>
    <span>短剧</span>
    <span>旅行</span>
    <span>彩妆</span>
</div>

    <!--搜索下拉（点击搜索图标弹出）-->
    <div id="search_drop" class="lj_search_drop">
        <div class="search-item">城市打卡</div>
        <div class="search-item">卧室改造</div>
        <div class="search-item">甜品探店</div>
        <div class="search-item">穿搭分享</div>
    </div>
    <!--卡片列表区域 瀑布流两列-->
    <main class="lj_card_wrap" id="lj_card_wrap">
        <!--JS动态渲染卡片-->
    </main>
    <!--底部tab栏-->
    <nav class="lj_tabbar">
        <div class="lj_tab_item active">
            <img class="lj_tab_icon" src="../img/home.png" alt="首页">
            <span>首页</span>
        </div>
        <div class="lj_tab_item">
            <img class="lj_tab_icon" src="../img/category.png" alt="市集">
            <span>市集</span>
        </div>
        <div class="lj_tab_item add-btn">
            <div class="add-circle">+</div>
            <span></span>
        </div>
        <div class="lj_tab_item">
            <img class="lj_tab_icon" src="../img/message.png" alt="消息">
            <span>消息</span>
        </div>
        <div class="lj_tab_item">
            <img class="lj_tab_icon" src="../img/user.png" alt="我">
            <span>我</span>
        </div>
    </nav>
<script>
    //JS1 模拟笔记数据
    const mockData = [
        {
            id:1,
            title:"大连万象城店需要素人服装展示",
            img:"../img/note1.jpg",
            author:"无法擦去的、印记6…",
            avatar:"../img/avatar1.jpg",
            likeNum:"1"
        },
        {
            id:2,
            title:"我宣布超市就是拍立得最出片的场地之一‼️",
            img:"../img/note2.jpg",
            author:"猫猫",
            avatar:"../img/avatar2.jpg",
            likeNum:"773"
        },
        {
            id:3,
            title:"国内9个适合短途旅行的城市",
            img:"../img/note3.jpg",
            author:"托马宝宝",
            avatar:"../img/avatar3.jpg",
            likeNum:"9"
        },
        {
            id:4,
            title:"Packing📦放生！没人真的会尴尬的🥺",
            img:"../img/note4.jpg",
            author:"芝士亮了一下",
            avatar:"../img/avatar4.jpg",
            likeNum:"1.6万"
        },
    ];
    //JS2 渲染卡片
    function renderCard(list){
        const wrap = document.getElementById("lj_card_wrap");
        wrap.innerHTML = "";
        list.forEach(item=>{
            wrap.innerHTML += `
                <div class="lj_card">
                    <div class="lj_card_img">
                        <img src="${item.img}" alt="${item.title}" onerror="this.style.opacity='0.2'">
                    </div>
                    <p class="lj_card_title">${item.title}</p>
                    <div class="lj_card_bottom">
                        <div class="lj_card_user">
                            <img src="${item.avatar}" alt="头像">
                            <span>${item.author}</span>
                        </div>
                        <div class="lj_card_like">❤️ ${item.likeNum}</div>
                    </div>
                </div>
            `
        })
    }
    renderCard(mockData);
    //JS3 搜索下拉交互
    const searchIcon = document.querySelector(".lj_header_search_icon");
    const dropBox = document.getElementById("search_drop");
    searchIcon.onclick = function(e){
        e.stopPropagation();
        if(dropBox.style.display === "block"){
            dropBox.style.display="none";
        }else{
            dropBox.style.display="block";
        }
    }
    document.addEventListener("click",function(e){
        if( !searchIcon.contains(e.target) && !dropBox.contains(e.target) ){
            dropBox.style.display="none";
        }
    })
</script>
</body>
</html>
