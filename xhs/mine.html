<!DOCTYPE html>
<!--学号：24001010529 姓名：林洁 mine.html 个人中心页面-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的｜仿小红书</title>
    <link rel="stylesheet" href="lj_common.css">
    <link rel="stylesheet" href="lj_mine.css">
</head>
<body>
    <!--个人头部区域-->
    <div class="lj_mine_header">
        <!--背景图容器（放最底层）-->
        <div class="lj_header_bg"></div>

        <!--【只保留这一组顶部导航，不要重复！】-->
        <div class="lj_mine_topnav">
            <span class="lj_menu">☰</span>
            <div class="lj_top_right">
                <button class="lj_setbg_btn">设置背景</button>
                <span class="lj_share">⤢</span>
            </div>
        </div>

        <div class="lj_mine_avatar">
            <img src="../img/avatar_mine.jpg" alt="个人头像">
            <span class="lj_plus_icon">+</span>
        </div>
        <div class="lj_mine_info">
            <h2 class="lj_mine_name">林大宝😈</h2>
            <p class="lj_mine_id">小红书号：1151746144 <span>品</span></p>
            <p class="lj_mine_desc">点击这里，填写简介</p>
        </div>
        <div class="lj_mine_gender">♀</div>
        <!--数据统计行-->
        <div class="lj_mine_data">
            <div class="data-item">
                <p class="num">1</p>
                <p class="txt">关注</p>
            </div>
            <div class="data-item">
                <p class="num">2</p>
                <p class="txt">粉丝</p>
            </div>
            <div class="data-item">
                <p class="num">0</p>
                <p class="txt">获赞与收藏</p>
            </div>
            <div class="lj_mine_btn_group">
                <button class="lj_edit_btn">编辑资料</button>
                <button class="lj_setting_btn">⚙</button>
            </div>
        </div>
        <!--功能卡片-->
        <div class="lj_mine_func">
            <div class="func-card">
                <span class="func-icon">⚡</span>
                <div>
                    <p>创作灵感</p>
                    <p class="func-sub">学创作找灵感</p>
                </div>
            </div>
            <div class="func-card">
                <span class="func-icon">🕒</span>
                <div>
                    <p>浏览记录</p>
                    <p class="func-sub">看过的笔记</p>
                </div>
            </div>
        </div>
    </div>
    <!--笔记标签切换栏-->
    <div class="lj_mine_tab">
        <span class="tab-item active">笔记</span>
        <span class="tab-item">收藏</span>
        <span class="tab-item">🔒 赞过</span>
        <span class="tab-search">🔍</span>
    </div>
    <div class="lj_mine_count">
        <span>公开 0</span>
        <span>🔒 私密 0</span>
        <span>合集 0</span>
    </div>
    <!--作品空白区域【文字改成和图二一样】-->
    <main class="lj_mine_content">
        <div class="empty-box">
            <div class="empty-img">🖼️</div>
            <p>看看你相册里舍不得删的图</p>
            <button class="lj_publish_btn" onclick="goPublish()">去发布</button>
        </div>
    </main>
    <!--底部tab公共导航，和首页共用-->
    <nav class="lj_tabbar">
        <div class="lj_tab_item">
            <img class="lj_tab_icon" src="../img/home.png" alt="首页">
            <a href="../index.html">首页</a>
        </div>
        <div class="lj_tab_item">
            <img class="lj_tab_icon" src="../img/category.png" alt="市集">
            <a href="../category.html">市集</a>
        </div>
        <div class="lj_tab_item">
            <img class="lj_tab_icon" src="../img/add.png" alt="发布">
            <a href="../publish.html">+</a>
        </div>
        <div class="lj_tab_item">
            <img class="lj_tab_icon" src="../img/message.png" alt="消息">
            <a href="../message.html">消息</a>
        </div>
        <div class="lj_tab_item active">
            <img class="lj_tab_icon" src="../img/user.png" alt="我">
            <span>我</span>
        </div>
    </nav>
<script>
    // JS：点击去发布，跳转到发布页面
    function goPublish(){
        location.href="publish.html";
    }
    // JS：标签切换效果
    const tabItems = document.querySelectorAll(".lj_mine_tab .tab-item");
    tabItems.forEach(item=>{
        item.onclick = function(){
            tabItems.forEach(i=>i.classList.remove("active"));
            this.classList.add("active");
        }
    })
</script>
</body>
</html>
