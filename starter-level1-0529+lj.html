<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>学生成绩分析面板 - L1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      background-color: #16213e;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .title-bar {
      background: #eee;
      padding: 14px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .title-bar h1 {
      font-size: 22px;
    }
    .tag-l1 {
      background: #4285f4;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 14px;
    }
    .block {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .block-title {
      font-size: 18px;
      margin-bottom: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* 班级概览四卡片 */
    .info-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .info-card {
      background: #f6f8ff;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
    }
    .info-card .num {
      font-size: 28px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 4px;
    }
    .info-card .label {
      font-size: 14px;
      color: #666;
    }
    /* 搜索栏 */
    .search-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #searchInput {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }
    #sortBtn {
      padding: 10px 16px;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    /* 不及格预警 */
    #warnList {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #warnList > div {
      color: #d92d20;
      font-size: 15px;
    }
    /* 学生卡片容器 */
    #cardWrap {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }
    .stu-card {
      background: #f8faff;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e5edff;
    }
    .card-head {
      text-align: center;
      position: relative;
      margin-bottom: 10px;
    }
    .rank-tag {
      position: absolute;
      top: 0;
      right: 0;
      background: #e8f0ff;
      color: #2563eb;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 8px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #cce0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 4px;
      font-size: 20px;
      color: #2563eb;
    }
    .name {
      font-weight: bold;
      font-size: 16px;
    }
    .id-gender {
      font-size: 13px;
      color: #666;
    }
    .score-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin: 10px 0;
      text-align: center;
    }
    .score-item .abbr {
      font-size: 12px;
      color: #777;
    }
    .score-item .val {
      font-size: 15px;
    }
    .text-red {
      color: red;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="title-bar">
    <h1>学生成绩分析面板</h1>
    <span class="tag-l1">等级一·基础</span>
  </div>

  <!-- 班级概览 -->
  <div class="block">
    <div class="block-title">班级概览</div>
    <div class="info-row">
      <div class="info-card">
        <div class="num" id="totalCount">0</div>
        <div class="label">班级人数（人）</div>
      </div>
      <div class="info-card">
        <div class="num" id="totalScore">0</div>
        <div class="label">班级总分</div>
      </div>
      <div class="info-card">
        <div class="num" id="avgScore">0</div>
        <div class="label">班级平均分</div>
      </div>
      <div class="info-card">
        <div class="num" id="passRate">0%</div>
        <div class="label">及格率（无不及格科目）</div>
      </div>
    </div>
  </div>

  <!-- 搜索+排序 -->
  <div class="block">
    <div class="block-title">数据操作</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="按姓名或学号搜索...">
      <button id="sortBtn">按总分↓</button>
    </div>
  </div>

  <!-- 不及格预警 -->
  <div class="block">
    <div class="block-title">不及格预警</div>
    <div id="warnList">
      <div>不及格学生名单</div>
    </div>
  </div>

  <!-- 学生卡片 -->
  <div class="block">
    <div class="block-title">学生成绩卡片</div>
    <div id="cardWrap"></div>
  </div>
</div>

<script>
/**
 * 科目配置
 */
const SUBJECTS = [
  { key: "chinese", name: "语文",     abbr: "语", full: 100 },
  { key: "math",    name: "数学",     abbr: "数", full: 100 },
  { key: "english", name: "英语",     abbr: "英", full: 100 },
  { key: "web",     name: "网页设计", abbr: "页", full: 100 },
  { key: "database",name: "数据库",   abbr: "库", full: 100 }
];

/**
 * 班级学生成绩原始数据
 */
const STUDENTS = [
  { id: "2024001", name: "张明轩", gender: "男", chinese: 88, math: 95, english: 82, web: 96, database: 90 },
  { id: "2024002", name: "李思琪", gender: "女", chinese: 92, math: 78, english: 90, web: 88, database: 85 },
  { id: "2024003", name: "王浩然", gender: "男", chinese: 75, math: 88, english: 79, web: 92, database: 86 },
  { id: "2024004", name: "陈雨桐", gender: "女", chinese: 95, math: 98, english: 96, web: 94, database: 92 },
  { id: "2024005", name: "刘子涵", gender: "男", chinese: 58, math: 65, english: 72, web: 80, database: 68 },
  { id: "2024006", name: "赵欣怡", gender: "女", chinese: 86, math: 90, english: 88, web: 95, database: 91 },
  { id: "2024007", name: "孙博文", gender: "男", chinese: 70, math: 55, english: 68, web: 75, database: 60 },
  { id: "2024008", name: "周诗涵", gender: "女", chinese: 100, math: 95, english: 98, web: 97, database: 99 },
  { id: "2024009", name: "吴俊杰", gender: "男", chinese: 82, math: 86, english: 75, web: 88, database: 80 },
  { id: "2024010", name: "郑雅文", gender: "女", chinese: 78, math: 92, english: 85, web: 90, database: 88 },
  { id: "2024011", name: "黄宇轩", gender: "男", chinese: 65, math: 70, english: 58, web: 72, database: 68 },
  { id: "2024012", name: "林晓彤", gender: "女", chinese: 90, math: 85, english: 92, web: 88, database: 94 },
  { id: "2024013", name: "高志远", gender: "男", chinese: 88, math: 92, english: 80, web: 85, database: 82 },
  { id: "2024014", name: "何雨萱", gender: "女", chinese: 76, math: 80, english: 85, web: 78, database: 72 },
  { id: "2024015", name: "罗子睿", gender: "男", chinese: 95, math: 88, english: 90, web: 92, database: 86 },
  { id: "2024016", name: "宋佳怡", gender: "女", chinese: 68, math: 72, english: 75, web: 70, database: 65 },
  { id: "2024017", name: "唐梓涵", gender: "男", chinese: 85, math: 90, english: 88, web: 95, database: 92 },
  { id: "2024018", name: "许若曦", gender: "女", chinese: 92, math: 96, english: 94, web: 98, database: 95 }
];

// 全局状态
let sortMode = 'total'; // total:总分降序 | id:学号升序
let searchKey = '';

/**
 * 纯函数：计算单个学生附加信息
 * @param {Object} stu 原始学生对象
 * @returns {Object} 加工后的学生
 */
function calcStudent(stu) {
  const scores = SUBJECTS.map(sub => stu[sub.key]);
  const total = scores.reduce((sum, val) => sum + val, 0);
  const avg = total / scores.length;

  const failList = [];
  SUBJECTS.forEach((sub, idx) => {
    if (scores[idx] < 60) {
      failList.push(sub.name);
    }
  })

  return {
    ...stu,
    scores,
    total,
    avg,
    failSubjects: failList,
    failCount: failList.length,
    isAllPass: failList.length === 0
  }
}

/**
 * 1. 渲染班级概览统计
 * @param {Array} list 加工后的学生数组
 */
function renderClassInfo(list) {
  const count = list.length;
  const classTotal = list.reduce((s, item) => s + item.total, 0);
  const classAvg = classTotal / (count * SUBJECTS.length);
  const passStudents = list.filter(item => item.isAllPass);
  const rate = (passStudents.length / count * 100).toFixed(1);

  document.getElementById('totalCount').textContent = count;
  document.getElementById('totalScore').textContent = classTotal;
  document.getElementById('avgScore').textContent = classAvg.toFixed(1);
  document.getElementById('passRate').textContent = rate + '%';
}

/**
 * 2. 渲染不及格预警名单（按不及格科目数量降序）
 * @param {Array} list 加工后的学生数组
 */
function renderWarn(list) {
  const failStu = list
    .filter(item => !item.isAllPass)
    .sort((a, b) => b.failCount - a.failCount);

  const warnBox = document.getElementById('warnList');
  warnBox.innerHTML = '';
  failStu.forEach(stu => {
    const div = document.createElement('div');
    div.textContent = `${stu.name}（学号${stu.id}）不及格科目：${stu.failSubjects.join('、')}`;
    warnBox.appendChild(div);
  })
}

/**
 * 3. 渲染学生卡片
 * @param {Array} list 加工后+排序后的学生数组
 */
function renderCards(list) {
  const wrap = document.getElementById('cardWrap');
  wrap.innerHTML = '';

  list.forEach((stu, index) => {
    const card = document.createElement('div');
    card.className = 'stu-card';

    let scoreHtml = '';
    SUBJECTS.forEach((sub, i) => {
      const score = stu.scores[i];
      const redClass = score < 60 ? 'text-red' : '';
      scoreHtml += `
        <div class="score-item">
          <div class="abbr">${sub.abbr}</div>
          <div class="val ${redClass}">${score}</div>
        </div>
      `
    })

    card.innerHTML = `
      <div class="card-head">
        <div class="rank-tag">第${index + 1}名</div>
        <div class="avatar">${stu.name[0]}</div>
        <div class="name">${stu.name}</div>
        <div class="id-gender">${stu.id} · ${stu.gender}</div>
      </div>
      <div class="score-row">${scoreHtml}</div>
      <div class="total-row">
        <span>总分：${stu.total}</span>
        <span>均分：${stu.avg.toFixed(1)}</span>
      </div>
    `
    wrap.appendChild(card);
  })
}

/**
 * 过滤 + 排序 得到最终渲染数组
 */
function getRenderList() {
  let arr = STUDENTS.map(calcStudent);
  if (searchKey.trim()) {
    const key = searchKey.trim().toLowerCase();
    arr = arr.filter(s => s.name.includes(key) || s.id.includes(key));
  }
  if (sortMode === 'total') {
    arr.sort((a, b) => b.total - a.total);
  } else {
    arr.sort((a, b) => a.id.localeCompare(b.id));
  }
  return arr;
}

/**
 * 总渲染入口
 */
function renderAll() {
  const renderList = getRenderList();
  renderClassInfo(renderList);
  renderWarn(renderList);
  renderCards(renderList);
}

// 事件绑定
document.getElementById('searchInput').addEventListener('input', function () {
  searchKey = this.value;
  renderAll();
})

document.getElementById('sortBtn').addEventListener('click', function () {
  if (sortMode === 'total') {
    sortMode = 'id';
    this.textContent = '按学号↑';
  } else {
    sortMode = 'total';
    this.textContent = '按总分↓';
  }
  renderAll();
})

// 初始化
renderAll();
</script>
</body>
</html>
